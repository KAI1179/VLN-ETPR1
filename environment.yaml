name: etpr1-new
channels:
  - aihabitat
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - pip<24.1
  - numpy
  - scipy
  - matplotlib
  - pillow=8.3.2
  - imageio
  - imageio-ffmpeg
  - ipykernel=5.5.5
  - ipython
  - jupyter_client=5.3.4
  - numba
  - quaternion
  - tqdm
  - lerc=3.0
variables:
  LD_LIBRARY_PATH: /home/vscode/.conda/envs/etpr1-new/lib
